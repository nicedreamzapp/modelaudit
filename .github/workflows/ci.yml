name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # The README says Python 3.8+. 3.8 is end-of-life, so it runs on the
          # older runner image that setup-python still has builds for.
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile (catches syntax this Python version can't parse)
        run: python -m compileall -q modelaudit tests
      - name: Run tests
        run: python -m pytest
      - name: Smoke test the CLI
        run: python -m modelaudit . --offline --all
