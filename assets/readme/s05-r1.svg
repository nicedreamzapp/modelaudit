<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="--ship. How it reaches people. Defaults to `service`, the strictest common case. --offline. Never touch the network; use only what&#x27;s on disk. --json. For CI. The exit code is 1 whenever there is a blocker."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="327.8" height="133" rx="10"/></clipPath><rect width="327.8" height="133" rx="10" fill="url(#n)"/><rect width="327.8" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="326.8" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="166" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">🚢 --ship</text><text x="166" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">How it reaches people. Defaults to</text><text x="166" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">`service`, the strictest common</text><text x="166" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">case.</text></g><g transform="translate(339.8,0)"><clipPath id="c0_1"><rect width="218.6" height="133" rx="10"/></clipPath><rect width="218.6" height="133" rx="10" fill="url(#n)"/><rect width="218.6" height="4" fill="#5a4f8f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="217.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="111" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">✈️ --offline</text><text x="111" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Never touch the</text><text x="111" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">network; use only</text><text x="111" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">what&#x27;s on disk.</text></g><g transform="translate(570.4,0)"><clipPath id="c0_2"><rect width="249.6" height="133" rx="10"/></clipPath><rect width="249.6" height="133" rx="10" fill="url(#n)"/><rect width="249.6" height="4" fill="#5a4f8f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="248.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="127" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">🤖 --json</text><text x="127" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">For CI. The exit code is 1</text><text x="127" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">whenever there is a</text><text x="127" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">blocker.</text></g></g></svg>
