<svg xmlns="http://www.w3.org/2000/svg" width="560" height="216" viewBox="0 0 560 216" role="img" aria-label="Weights have their own license. Separate from the code that runs them. Hugging Face says &quot;other&quot;. The real license name sits in a different field. modelaudit reads the second field. How you ship matters. GPL and AGPL behave differently the moment a network is involved."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="234.2" height="126" rx="10"/></clipPath><rect width="234.2" height="126" rx="10" fill="url(#n)"/><rect width="234.2" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="233.2" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="119" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🏋️ Weights have</text><text x="119" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#decdd4">their own license</text><text x="119" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">Separate from the code</text><text x="119" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">that runs them.</text></g><g transform="translate(244.2,0)"><clipPath id="c0_1"><rect width="315.8" height="126" rx="10"/></clipPath><rect width="315.8" height="126" rx="10" fill="url(#n)"/><rect width="315.8" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="314.8" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="160" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🏷️ Hugging Face says &quot;other&quot;</text><text x="160" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The real license name sits in a</text><text x="160" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">different field. modelaudit reads the</text><text x="160" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">second field.</text></g><g transform="translate(0.0,136)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🌐 How you ship matters</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">GPL and AGPL behave differently the moment a network is involved.</text></g></g></svg>
