<svg xmlns="http://www.w3.org/2000/svg" width="560" height="125" viewBox="0 0 560 125" role="img" aria-label="No pip package yet. Clone it and run it from the repo folder, or put the repo on `PYTHONPATH`. Hugging Face cache. The second command scans it; a normal walk skips it."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="290.6" height="125" rx="10"/></clipPath><rect width="290.6" height="125" rx="10" fill="url(#n)"/><rect width="290.6" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="289.6" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="147" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">📥 No pip package yet</text><text x="147" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Clone it and run it from the repo</text><text x="147" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">folder, or put the repo on</text><text x="147" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">`PYTHONPATH`.</text></g><g transform="translate(300.6,0)"><clipPath id="c0_1"><rect width="259.4" height="125" rx="10"/></clipPath><rect width="259.4" height="125" rx="10" fill="url(#n)"/><rect width="259.4" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="258.4" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="132" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🗄️ Hugging Face cache</text><text x="132" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The second command scans</text><text x="132" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">it; a normal walk skips it.</text></g></g></svg>
