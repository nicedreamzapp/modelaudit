<svg xmlns="http://www.w3.org/2000/svg" width="820" height="109" viewBox="0 0 820 109" role="img" aria-label="No pip package yet. Clone it and run it from the repo folder, or put the repo on `PYTHONPATH`. Hugging Face cache. The second command scans it; a normal walk skips it."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="404.0" height="109" rx="10"/></clipPath><rect width="404.0" height="109" rx="10" fill="url(#n)"/><rect width="404.0" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="403.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="204" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">📥 No pip package yet</text><text x="204" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Clone it and run it from the repo folder, or put</text><text x="204" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">the repo on `PYTHONPATH`.</text></g><g transform="translate(416.0,0)"><clipPath id="c0_1"><rect width="404.0" height="109" rx="10"/></clipPath><rect width="404.0" height="109" rx="10" fill="url(#n)"/><rect width="404.0" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="403.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="204" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🗄️ Hugging Face cache</text><text x="204" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The second command scans it; a normal walk</text><text x="204" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">skips it.</text></g></g></svg>
