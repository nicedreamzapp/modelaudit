site_name: modelaudit
site_description: >-
  modelaudit is a free, offline-first command-line tool that finds license
  obligations in a local AI stack, including the licenses on downloaded model
  weights, and judges them against how you ship (app, service or private).
# TODO-VERIFY: placeholder until GitHub Pages is switched on for this repo.
site_url: https://nicedreamzapp.github.io/modelaudit/
site_author: Matt Macosko
repo_url: https://github.com/nicedreamzapp/modelaudit
repo_name: nicedreamzapp/modelaudit
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Matt Macosko / Nice Dreamz LLC. modelaudit is MIT licensed.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - social
  # The sitemap.xml is generated by MkDocs itself whenever site_url is set.

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nicedreamzapp/modelaudit

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
